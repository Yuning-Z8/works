<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>作业查看器</title>
    <style>
        :root {
            /* 主题色 */
            --color-primary: #3b82f6;
            --color-primary-dark: #2563eb;
            --color-secondary: #10b981;
            --color-secondary-dark: #059669;
            --color-warning: #f59e0b;
            --color-accent: #346ac1;

            /* 背景色 */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.05);
            --bg-list: rgba(0, 0, 0, 0.1);
            --bg-status: rgba(255, 255, 255, 0.03);
            --bg-date: rgba(255, 255, 255, 0.03);
            --bg-date-disabled: rgba(255, 255, 255, 0.01);
            --bg-date-work: rgba(52, 168, 83, 0.2);
            --bg-date-no-work: rgba(255, 255, 255, 0.02);

            /* 文本色 */
            --text-primary: rgba(255, 255, 255, 0.9);
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            --text-disabled: rgba(255, 255, 255, 0.3);

            /* 边框色 */
            --border-primary: rgba(255, 255, 255, 0.05);
            --border-secondary: rgba(255, 255, 255, 0.08);
            --border-date: rgba(255, 255, 255, 0.05);
            --border-date-hover: rgba(59, 130, 246, 0.5);
            --border-date-active: rgba(59, 130, 246, 0.8);
            --border-date-work: #34a853;
            --border-date-work-active: rgba(16, 185, 129, 0.8);

            /* 阴影 */
            --shadow-primary: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-btn: 0 4px 15px rgba(66, 133, 244, 0.3);
            --shadow-btn-hover: 0 6px 20px rgba(59, 130, 246, 0.35);
            --shadow-card: 0 4px 15px rgba(0,0,0,0.2);
            --shadow-card-hover: 0 8px 25px rgba(0,0,0,0.2);
            --shadow-date-active: 0 4px 12px rgba(59, 130, 246, 0.25);
            --shadow-date-work-active: 0 4px 12px rgba(16, 185, 129, 0.25);
            --shadow-subject: 0 2px 8px rgba(0,0,0,0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
        }

        /* 背景装饰元素 */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
            z-index: -1;
        }

        body::before {
            width: 600px;
            height: 600px;
            background: var(--color-primary);
            top: -300px;
            right: -100px;
            animation: float 20s infinite ease-in-out;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: var(--color-secondary);
            bottom: -250px;
            left: -150px;
            animation: float 25s infinite ease-in-out 2s;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 100%;
            margin: 0;
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-status);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 20px 25px;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .calendar-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .calendar-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-toggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .status-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge, .subject-badge {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.blue, .subject-badge.blue {
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid rgba(59, 130, 246, 0.3);
            color: rgba(59, 130, 246, 0.9);
        }

        .status-badge.green, .subject-badge.green {
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid rgba(16, 185, 129, 0.3);
            color: rgba(16, 185, 129, 0.9);
        }

        .status-badge.yellow, .subject-badge.yellow {
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid rgba(245, 158, 11, 0.3);
            color: rgba(245, 158, 11, 0.9);
        }

        .scan-btn {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            color: var(--text-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-btn);
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-btn-hover);
        }

        .scan-btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .reload-config-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            margin-right: 10px;
            border-radius: 25px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 36px;
            height: 36px;
        }

        .reload-config-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .reload-config-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.5s ease;
        }

        .reload-config-btn.rotate svg {
            transform: rotate(360deg);
        }

        .reload-config-btn::after {
            content: '重载配置';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 5px;
        }

        .reload-config-btn:hover::after {
            opacity: 1;
        }

        .action-buttons {
            display: flex;
            align-items: center;
        }

        /* 主内容区 */
        .content {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* 左侧日历：独立滚动 */
        .sidebar {
            width: 320px;
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            overflow: hidden;
        }

        .calendar-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .month-section {
            margin-bottom: 28px;
        }

        .month-title {
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding: 8px 0 6px 0;
            background: transparent;
            backdrop-filter: none;
            border: none;
            box-shadow: none;
            line-height: 1.4;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .month-title br {
            display: block;
            content: "";
            margin: 2px 0;
        }

        .dates-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .date-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-date);
            border: 3px solid var(--border-date);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            color: var(--text-secondary);
            position: relative;
        }

        .date-item:hover {
            border-color: var(--border-date-hover);
            transform: scale(1.05);
            color: var(--text-primary);
        }

        .date-item.no-work,
        .date-item.disabled {
            background: var(--bg-date-no-work);
            color: var(--text-disabled);
            cursor: default;
        }

        .date-item.no-work:hover,
        .date-item.disabled:hover {
            transform: none;
            border-color: var(--border-date);
        }

        .date-item.has-work {
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            position: relative;
        }

        .date-item.has-work:hover {
            border-color: var(--border-date-hover);
        }

        .date-item.has-work.active {
            background: var(--color-primary);
            border-color: var(--border-date-active);
            box-shadow: var(--shadow-date-active);
            color: rgba(255, 255, 255, 0.95);
            filter: none !important;
        }

        .date-item.has-work::after {
            content: attr(data-work-count);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            margin-bottom: 5px;
        }

        .date-item.has-work:hover::after {
            opacity: 1;
        }

        .works-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-list);
            min-width: 0;
        }

        .works-header-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 25px 25px 0 25px;
            margin-bottom: 0;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--color-accent);
            flex-shrink: 0;
        }

        .works-header {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        #worksContainer {
            flex: 1;
            overflow-y: auto;
            padding: 25px 25px 25px 25px;
        }

        .works-grid {
            display: grid;
            gap: 15px;
        }

        .work-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-card);
        }

        .work-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-hover);
            border-color: rgba(var(--subject-r), var(--subject-g), var(--subject-b), 0.3);
            background: var(--bg-card-hover);
        }

        .work-card.no-url {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--bg-card);
            border-color: var(--border-primary);
        }

        .work-card.no-url:hover {
            transform: none;
            box-shadow: var(--shadow-card);
            border-color: var(--border-primary);
            background: var(--bg-card);
        }

        .work-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .subject-badge {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 15px;
            flex-shrink: 0;
            box-shadow: var(--shadow-subject);
            padding: 0;
        }

        .work-title {
            flex: 1;
        }

        .work-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-size: 16px;
            line-height: 1.4;
        }

        .work-meta {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .work-time-info {
            font-size: 12px;
            margin-top: 4px;
        }

        .work-time-info.blue { color: var(--color-primary); }
        .work-time-info.yellow { color: var(--color-warning); }
        .work-time-info.green { color: var(--color-secondary); }
        .work-time-info.gray { color: var(--text-disabled); }
        .work-time-info.red { color: #ef4444; }

        .no-works {
            text-align: center;
            color: var(--text-tertiary);
            padding: 60px 20px;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            color: var(--color-primary);
            padding: 40px 20px;
        }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* 日历底部加载指示器 */
        .calendar-loading-more {
            text-align: center;
            padding: 15px;
            color: var(--color-primary);
            font-size: 13px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        .auth-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(420px, calc(100% - 40px));
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            padding: 24px;
            z-index: 999;
            display: none;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .auth-modal.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .auth-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .auth-modal-title {
            font-size: 18px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .auth-modal-close {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 18px;
        }

        .auth-modal-body {
            display: grid;
            gap: 14px;
        }

        .auth-modal-body label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-modal-body input,
        .auth-modal-body button,
        .auth-modal-body select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 14px;
        }

        .auth-modal-body button {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
            border: none;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .auth-modal-body button:hover {
            transform: translateY(-1px);
        }

        .auth-modal-footnote {
            color: var(--text-tertiary);
            font-size: 12px;
            line-height: 1.6;
        }

        .auth-modal-note {
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: var(--text-secondary);
            white-space: pre-line;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .status-left .calendar-toggle {
                display: none;
            }

            .works-header-container .calendar-toggle {
                display: block;
            }

            .content {
                flex-direction: column;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 999;
                transform: translateX(-100%);
                width: 85%;
                max-width: 320px;
                transition: transform 0.3s ease;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .works-list {
                width: 100%;
            }

            body.sidebar-open {
                overflow: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-bar">
            <div class="status-left">
                <button class="calendar-toggle" id="calendarToggle">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                    </svg>
                </button>
                <div class="status-info">
                    <div class="status-item">
                        <span>扫描状态:</span>
                        <span id="scanStatus" class="status-badge green">就绪</span>
                    </div>
                    <div class="status-item">
                        <span>作业总数:</span>
                        <span id="totalWorks" class="status-badge blue">0</span>
                    </div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="reload-config-btn" id="reloadConfigBtn" onclick="reloadConfig()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.66-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.58.25-1.14.59-1.66.98l-2.49-1c-.22-.08-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.64-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.66.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.58-.25 1.14-.59 1.66-.98l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-7.43 2.52c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                    </svg>
                </button>
                <button class="scan-btn" id="scanBtn" onclick="triggerScan()">
                    <span>立即扫描</span>
                </button>
            </div>
        </div>

        <div class="overlay" id="overlay"></div>

        <div class="auth-modal" id="authModal">
            <div class="auth-modal-header">
                <div class="auth-modal-title">授权访问</div>
                <button class="auth-modal-close" onclick="closeAuthModal()">×</button>
            </div>
            <div class="auth-modal-body">
                <label>
                    <span>令牌类型</span>
                    <select id="authTypeSelect">
                        <option value="temp">临时令牌 (15 分钟)</option>
                        <option value="permanent">永久令牌</option>
                    </select>
                </label>
                <button type="button" onclick="requestAuthCode()">获取验证码</button>
                <label>
                    <span>验证码 ID</span>
                    <input id="authCodeId" readonly placeholder="点击获取验证码后显示" />
                </label>
                <label>
                    <span>输入验证码</span>
                    <input id="authCodeInput" placeholder="请输入控制台显示的验证码" />
                </label>
                <button type="button" onclick="verifyAuthCode()">确认授权</button>
                <div class="auth-modal-note">
                    获取验证码后，请查看服务器控制台中打印的验证码。
                    验证成功后令牌将保存在浏览器 Cookie 中，后续操作会自动使用该令牌。
                </div>
            </div>
        </div>

        <div class="content">
            <div class="sidebar" id="sidebar">
                <div class="calendar-section" id="calendarSection">
                    <div id="calendar"></div>
                </div>
            </div>

            <div class="works-list">
                <div class="works-header-container">
                    <button class="calendar-toggle" id="mobileCalendarToggle">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                        </svg>
                    </button>
                    <div class="works-header" id="worksHeader">选择日期查看作业</div>
                </div>
                <div id="worksContainer">
                    <div class="no-works">
                        <div>请从左侧选择日期查看作业</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局状态
        let currentDate = '';
        let calendarData = {};
        let subjectMap = {};
        let checkInterval = 3600;
        let lastScanTimestamp = 0;
        let scanInProgress = false;
        let totalWorks = 0;
        let cachedWorks = [];
        let isRefreshing = false;
        let statusInterval = null;
        let autoPolling = false;
        let autoPollIntervalId = null;
        const AUTH_COOKIE_NAME = 'auth_token';
        let pendingAuthAction = null;

        // 无限滚动相关
        let loadedMonthsSet = new Set();      // 已加载的月份key (YYYYMM)
        let isLoadingMore = false;
        let initialMonthsCount = 4;            // 初始加载4个月
        let loadMoreCount = 3;                 // 每次滚动加载3个月
        let calendarScrollListener = null;

        document.addEventListener('DOMContentLoaded', async function() {
            await loadConfig();
            await loadStatus();
            await initCalendar();               // 初始化无限滚动日历
            await loadWorksForToday();
            setupMobileEvents();
            startTimers();
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) closeSidebar();
            });
        });

        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                subjectMap = config.subject_config;
                checkInterval = config.check_interval || 3600;
            } catch (error) { console.error('加载配置失败:', error); }
        }

        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                lastScanTimestamp = status.last_scan_time;
                scanInProgress = status.scan_in_progress;
                totalWorks = status.total_works;
                updateStatusDisplay();
            } catch (error) { console.error('获取状态失败:', error); }
        }

        function setCookie(name, value, maxAgeSeconds) {
            document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=${maxAgeSeconds}; samesite=lax`;
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
            return null;
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; samesite=lax`;
        }

        function getStoredAuthToken() {
            return getCookie(AUTH_COOKIE_NAME);
        }

        function saveAuthToken(token, tokenType) {
            const maxAge = tokenType === 'temp' ? 900 : 365 * 24 * 60 * 60;
            setCookie(AUTH_COOKIE_NAME, token, maxAge);
        }

        function openAuthModal(actionName) {
            pendingAuthAction = actionName || null;
            document.getElementById('authModal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('authCodeInput').value = '';
            if (!pendingAuthAction) document.getElementById('authCodeId').value = '';
        }

        async function requestAuthCode() {
            const type = document.getElementById('authTypeSelect').value;
            try {
                const response = await fetch(`/api/auth/code?type=${encodeURIComponent(type)}`);
                const data = await response.json();
                if (response.ok && data.code_id) {
                    document.getElementById('authCodeId').value = data.code_id;
                    alert('验证码已创建，请查看服务端控制台获取具体验证码。');
                } else {
                    alert(data.error || '获取验证码失败');
                }
            } catch (error) {
                console.error(error);
                alert('获取验证码失败');
            }
        }

        async function verifyAuthCode() {
            const codeId = document.getElementById('authCodeId').value;
            const code = document.getElementById('authCodeInput').value.trim();
            if (!codeId || !code) {
                alert('请先获取验证码并输入验证码');
                return;
            }
            try {
                const response = await fetch('/api/auth/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code_id: codeId, code })
                });
                const data = await response.json();
                if (response.ok && data.token) {
                    saveAuthToken(data.token, data.type || 'temp');
                    closeAuthModal();
                    alert('授权成功，令牌已保存。');
                    if (pendingAuthAction === 'scan') {
                        pendingAuthAction = null;
                        triggerScan();
                    } else if (pendingAuthAction === 'reloadConfig') {
                        pendingAuthAction = null;
                        reloadConfig();
                    }
                } else {
                    alert(data.error || '授权失败');
                }
            } catch (error) {
                console.error(error);
                alert('授权失败');
            }
        }

        async function fetchWithAuth(url, options = {}) {
            options.headers = options.headers || {};
            const token = getStoredAuthToken();
            if (!token) {
                openAuthModal();
                throw new Error('需要授权');
            }
            options.headers.Authorization = `Bearer ${token}`;
            const response = await fetch(url, options);
            if (response.status === 401) {
                deleteCookie(AUTH_COOKIE_NAME);
                openAuthModal();
                throw new Error('授权失败');
            }
            return response;
        }

        function updateStatusDisplay() {
            const scanStatusSpan = document.getElementById('scanStatus');
            if (scanInProgress) {
                scanStatusSpan.textContent = '扫描中';
                scanStatusSpan.className = 'status-badge yellow';
            } else {
                const elapsed = Date.now() / 1000 - lastScanTimestamp;
                let text = '';
                if (elapsed < 300) text = '刚刚';
                else if (elapsed < 3600) text = `${Math.floor(elapsed / 60)}分钟前`;
                else text = `${Math.floor(elapsed / 3600)}小时前`;
                scanStatusSpan.innerHTML = `就绪 (${text})`;
                scanStatusSpan.className = 'status-badge green';
            }
            document.getElementById('totalWorks').innerText = totalWorks;
        }

        async function refreshData() {
            if (isRefreshing) return;
            isRefreshing = true;
            await loadStatus();
            // 重置日历：清空缓存，重新加载初始月份
            await resetAndReloadCalendar();
            if (currentDate) await loadWorks(currentDate);
            else await loadWorksForToday();
            isRefreshing = false;
        }

        function startAutoPolling() {
            if (autoPolling) return;
            autoPolling = true;
            const initialLastScan = lastScanTimestamp;
            autoPollIntervalId = setInterval(async () => {
                try {
                    const response = await fetch('/api/status');
                    const status = await response.json();
                    if (!status.scan_in_progress && status.last_scan_time !== initialLastScan) {
                        lastScanTimestamp = status.last_scan_time;
                        scanInProgress = status.scan_in_progress;
                        totalWorks = status.total_works;
                        updateStatusDisplay();
                        clearInterval(autoPollIntervalId);
                        autoPolling = false;
                        await refreshData();
                    }
                } catch (error) { console.error('自动轮询失败:', error); }
            }, 15000);
        }

        function startTimers() {
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(() => {
                updateStatusDisplay();
                updateTimeDisplay();
                const now = Date.now() / 1000;
                if (!scanInProgress && !autoPolling && (now - lastScanTimestamp) > checkInterval) {
                    startAutoPolling();
                }
            }, 1000);
        }

        function updateTimeDisplay() {
            const cards = document.querySelectorAll('.work-card');
            if (!cards.length) return;
            cards.forEach(card => {
                const workId = card.getAttribute('data-work-id');
                if (!workId) return;
                const work = cachedWorks.find(w => w.work_id === workId);
                if (!work) return;
                const { timeHtml, timeClass } = formatTimeDisplay(work);
                const timeElement = card.querySelector('.work-time-info');
                if (timeElement) {
                    timeElement.innerHTML = timeHtml;
                    timeElement.className = `work-time-info ${timeClass}`;
                }
            });
        }
    // 重置日历状态，重新加载初始4个月
    async function resetAndReloadCalendar() {
        // 清空日历容器，重置集合
        const calendarDiv = document.getElementById('calendar');
        calendarDiv.innerHTML = '';
        loadedMonthsSet.clear();
        calendarData = {};
        await loadInitialMonths();
    }

    // 加载初始4个月 (当前月及之前3个月，共4个月)
    async function loadInitialMonths() {
        await fetchAndAppendMonths(initialMonthsCount);
        // 滚动到顶部（当前月显示）
        const section = document.getElementById('calendarSection');
        if (section) section.scrollTop = 0;
    }

    // 加载更早的月份（向前加载）
    async function loadEarlierMonths() {
        await fetchAndAppendMonths(loadMoreCount);
    }

    // 请求月份数据并追加到日历末尾
    async function fetchAndAppendMonths(monthsCount) {
    if (monthsCount <= 0) return;
    if (isLoadingMore) return;
    isLoadingMore = true;

    const monthKeys = [];

    // 根据 loadedMonthsSet 是否为空决定加载方向
    const isInitial = loadedMonthsSet.size === 0;

    if (isInitial) {
        // 初始加载：从当前月向前推 monthsCount 个月（从近到远）
        const today = new Date();
        for (let i = 0; i < monthsCount; i++) {
            const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const key = `${year}${month}`;
            if (!loadedMonthsSet.has(key)) {
                monthKeys.push(key);
            }
        }
    } else {
        // 滚动加载：基于已加载的最早月份，向前推 monthsCount 个月（从远到近）
        const sortedLoaded = Array.from(loadedMonthsSet).sort();
        const earliest = sortedLoaded[0];
        const year = parseInt(earliest.slice(0, 4));
        const month = parseInt(earliest.slice(4, 6));
        const baseDate = new Date(year, month - 1, 1);
        for (let i = monthsCount; i >= 1; i--) {
            const prev = new Date(baseDate.getFullYear(), baseDate.getMonth() - i, 1);
            const y = prev.getFullYear();
            const m = String(prev.getMonth() + 1).padStart(2, '0');
            const key = `${y}${m}`;
            if (!loadedMonthsSet.has(key)) {
                monthKeys.push(key);
            }
        }
    }

    if (monthKeys.length === 0) {
        isLoadingMore = false;
        return;
    }

    const calendarDiv = document.getElementById('calendar');
    let loadingIndicator = null;
    // 仅滚动加载时显示动画
    if (!isInitial) {
        loadingIndicator = document.createElement('div');
        loadingIndicator.className = 'calendar-loading-more';
        loadingIndicator.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;"></div><div>加载更早作业...</div>';
        calendarDiv.appendChild(loadingIndicator);
        loadingIndicator.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    try {
        const response = await fetch(`/api/calendar?months=${monthKeys.join(',')}`);
        const newData = await response.json();
        for (const [mk, val] of Object.entries(newData)) {
            if (!calendarData[mk]) calendarData[mk] = {};
            Object.assign(calendarData[mk], val);
        }
        for (const monthKey of monthKeys) {
            if (loadedMonthsSet.has(monthKey)) continue;
            const year = parseInt(monthKey.slice(0, 4));
            const monthIdx = parseInt(monthKey.slice(4, 6)) - 1;
            const monthDate = new Date(year, monthIdx, 1);
            const monthSection = createMonthSection(monthDate);
            calendarDiv.appendChild(monthSection);
            loadedMonthsSet.add(monthKey);
        }
    } catch (error) {
        console.error('加载月份数据失败:', error);
    } finally {
        if (loadingIndicator && loadingIndicator.parentNode) loadingIndicator.remove();
        isLoadingMore = false;
    }
}

    // 初始化日历: 设置滚动监听，加载初始月份
    async function initCalendar() {
        // 先清空
        const calendarDiv = document.getElementById('calendar');
        calendarDiv.innerHTML = '';
        loadedMonthsSet.clear();
        calendarData = {};
        await loadInitialMonths();
        // 监听滚动到底部
        if (calendarScrollListener) {
            document.getElementById('calendarSection')?.removeEventListener('scroll', calendarScrollListener);
        }
        const scrollContainer = document.getElementById('calendarSection');
        calendarScrollListener = () => {
            if (!scrollContainer) return;
            const { scrollTop, scrollHeight, clientHeight } = scrollContainer;
            // 距离底部小于80px时触发加载
            if (scrollHeight - scrollTop - clientHeight < 80 && !isLoadingMore) {
                loadEarlierMonths();
            }
        };
        scrollContainer.addEventListener('scroll', calendarScrollListener);
    }

    // 生成单个月份区域
    function createMonthSection(date) {
        const year = date.getFullYear();
        const month = date.getMonth();
        const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
        const section = document.createElement('div');
        section.className = 'month-section';
        const title = document.createElement('div');
        title.className = 'month-title';
        // 样式: xxxx年 xx月 + 换行 + 长横线
        title.innerHTML = `${year}年 ${monthNames[month]}`;
        section.appendChild(title);
        const grid = document.createElement('div');
        grid.className = 'dates-grid';
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const today = new Date();
        const todayYear = today.getFullYear(), todayMonth = today.getMonth(), todayDate = today.getDate();
        const firstDayOfWeek = firstDay.getDay() || 7;
        for (let i = 1; i < firstDayOfWeek; i++) {
            const empty = document.createElement('div');
            empty.className = 'date-item disabled';
            empty.style.visibility = 'hidden';
            grid.appendChild(empty);
        }
        const monthKey = `${year}${String(month+1).padStart(2,'0')}`;
        for (let day = 1; day <= daysInMonth; day++) {
            const dateItem = document.createElement('div');
            dateItem.className = 'date-item';
            dateItem.textContent = day;
            const isFuture = (year > todayYear) || (year === todayYear && month > todayMonth) || (year === todayYear && month === todayMonth && day > todayDate);
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const workCount = calendarData[monthKey]?.[dateStr] || 0;
            if (isFuture) {
                dateItem.classList.add('disabled');
            } else if (workCount > 0) {
                dateItem.classList.add('has-work');
                dateItem.setAttribute('data-work-count', `${workCount}个作业`);
                dateItem.addEventListener('click', (e) => selectDate(e, year, month, day));
                const brightness = Math.min(0.9 + (workCount-1)*0.08, 1.3);
                dateItem.style.filter = `brightness(${brightness})`;
            } else {
                dateItem.classList.add('no-work');
            }
            if (year === todayYear && month === todayMonth && day === todayDate) {
                dateItem.classList.add('active');
                if (!isFuture && workCount > 0) currentDate = dateStr;
            }
            grid.appendChild(dateItem);
        }
        section.appendChild(grid);
        return section;
    }

    function selectDate(event, year, month, day) {
        document.querySelectorAll('.date-item.active').forEach(item => {
            item.classList.remove('active');
            if (item.classList.contains('has-work')) {
                const cnt = parseInt(item.getAttribute('data-work-count')||'1');
                const b = Math.min(0.9+(cnt-1)*0.08, 1.3);
                item.style.filter = `brightness(${b})`;
            }
        });
        let target = event.target;
        while (target && !target.classList.contains('date-item')) target = target.parentElement;
        if (target && target.classList.contains('date-item')) {
            target.classList.add('active');
            target.style.filter = 'none';
            currentDate = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            loadWorks(currentDate);
            if (window.innerWidth <= 768) setTimeout(closeSidebar, 80);
        }
    }

        async function loadWorksForToday() {
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            await loadWorks(todayStr);
        }

        async function loadWorks(date) {
            try {
                const worksContainer = document.getElementById('worksContainer');
                const worksHeader = document.getElementById('worksHeader');
                worksHeader.textContent = `${date} 的作业`;
                worksContainer.innerHTML = `<div class="loading"><div class="loading-spinner"></div><div>加载中...</div></div>`;
                const response = await fetch(`/api/works?date=${date}`);
                const works = await response.json();
                cachedWorks = works;
                displayWorks(works);
            } catch (error) {
                document.getElementById('worksContainer').innerHTML = `<div class="no-works"><div>加载失败，请重试</div></div>`;
            }
        }

        function displayWorks(works) {
            const worksContainer = document.getElementById('worksContainer');
            if (!works || works.length === 0) {
                worksContainer.innerHTML = `<div class="no-works"><div>该日期没有作业</div></div>`;
                return;
            }
            worksContainer.innerHTML = `<div class="works-grid">${works.map(work => {
                const hasContent = work.has_content !== undefined ? work.has_content : true;
                const isNoUrl = !hasContent;
                const subjectInfo = subjectMap[work.subject_id] || subjectMap['default'] || { name: '未知', color: '#A0A0A0', short: '未' };
                const rgbColor = hexToRgb(subjectInfo.color);
                const bgColor = `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.15)`;
                const borderColor = `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.3)`;
                const textColor = `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.9)`;
                const { timeHtml, timeClass } = formatTimeDisplay(work);
                return `<div class="work-card ${isNoUrl ? 'no-url' : ''}" data-work-id="${work.work_id}" ${!isNoUrl ? `onclick="openWork('${work.work_id}')"` : ''} style="--subject-r: ${rgbColor.r}; --subject-g: ${rgbColor.g}; --subject-b: ${rgbColor.b};">
                            <div class="work-header">
                                <div class="subject-badge" style="background: ${bgColor}; border: 3px solid ${borderColor}; color: ${textColor};">${escapeHtml(subjectInfo.short)}</div>
                                <div class="work-title">
                                    <div class="work-name">${escapeHtml(work.work_name)}</div>
                                    <div class="work-meta">${escapeHtml(subjectInfo.name)}</div>
                                    <div class="work-time-info ${timeClass}">${timeHtml}</div>
                                </div>
                            </div>
                        </div>`;
            }).join('')}</div>`;
        }

        function formatTimeDisplay(work) {
            const now = Date.now();
            let timeHtml = '', timeClass = 'blue';
            if (work.is_exam) {
                const startTime = work.start_time, endTime = work.upto_time;
                if (now < startTime) {
                    const diff = startTime - now;
                    const days = Math.floor(diff / (1000*60*60*24)), hours = Math.floor((diff % (86400000)) / 3600000), minutes = Math.floor((diff % 3600000) / 60000);
                    if (days > 0) { timeHtml = `距离开始: ${days}天${hours}小时`; timeClass = 'green'; }
                    else if (hours > 0) { timeHtml = `距离开始: ${hours}小时${minutes}分钟`; timeClass = 'green'; }
                    else if (minutes > 0) { timeHtml = `距离开始: ${minutes}分钟`; timeClass = 'yellow'; }
                    else { timeHtml = '即将开始'; timeClass = 'yellow'; }
                } else if (now < endTime) {
                    const diff = endTime - now, hours = Math.floor(diff / 3600000), minutes = Math.floor((diff % 3600000) / 60000), seconds = Math.floor((diff % 60000) / 1000);
                    if (hours > 0) { timeHtml = `距离结束: ${hours}小时${minutes}分钟`; timeClass = 'yellow'; }
                    else if (minutes > 0) { timeHtml = `距离结束: ${minutes}分钟${seconds}秒`; timeClass = 'red'; }
                    else if (seconds > 0) { timeHtml = `距离结束: ${seconds}秒`; timeClass = 'red'; }
                    else { timeHtml = '即将结束'; timeClass = 'red'; }
                } else { timeHtml = '已结束'; timeClass = 'gray'; }
            } else {
                const uptoTime = parseInt(work.upto_time), timeDiff = uptoTime - now, twoHours = 7200000;
                if (timeDiff < 0) { timeHtml = '已截止'; timeClass = 'gray'; }
                else if (timeDiff < twoHours) {
                    const minutes = Math.floor(timeDiff / 60000), seconds = Math.floor((timeDiff % 60000) / 1000);
                    timeHtml = minutes > 0 ? `距离截止: ${minutes}分钟` : `距离截止: ${seconds}秒`;
                    timeClass = 'red';
                } else {
                    const hours = Math.floor(timeDiff / 3600000), minutes = Math.floor((timeDiff % 3600000) / 60000);
                    if (hours > 24) { const days = Math.floor(hours / 24); timeHtml = `距离截止: ${days}天${hours % 24}小时`; }
                    else { timeHtml = `距离截止: ${hours}小时${minutes}分钟`; }
                    timeClass = 'blue';
                }
            }
            return { timeHtml, timeClass };
        }


        function hexToRgb(hex) { return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) }; }
        function openWork(workId) { window.open(`/work/${workId}`, '_blank'); }

        async function triggerScan() {
            pendingAuthAction = 'scan';
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true; scanBtn.innerHTML = '<span>扫描中...</span>';
            try {
                const response = await fetchWithAuth('/api/scan', { method: 'POST' });
                const result = await response.json();
                if (result.status === 'success') pollManualScan();
                else alert(result.message);
            } catch (error) {
                if (error.message !== '需要授权' && error.message !== '授权失败') console.error(error);
            } finally { resetScanButton(); }
        }

    function pollManualScan() {
        const checkStatus = setInterval(async () => {
            try {
                const status = await fetch('/api/status').then(res => res.json());
                if (!status.scan_in_progress) {
                    clearInterval(checkStatus);
                    lastScanTimestamp = status.last_scan_time; scanInProgress = false; totalWorks = status.total_works;
                    updateStatusDisplay(); await refreshData(); resetScanButton();
                }
            } catch (error) { clearInterval(checkStatus); resetScanButton(); }
        }, 1000);
    }

    function resetScanButton() { const btn = document.getElementById('scanBtn'); btn.disabled = false; btn.innerHTML = '<span>立即扫描</span>'; }

    async function reloadConfig() {
        pendingAuthAction = 'reloadConfig';
        const btn = document.getElementById('reloadConfigBtn'); btn.classList.add('rotate');
        try {
            const res = await fetchWithAuth('/api/config/reload', { method: 'POST' });
            const data = await res.json();
            if (data.status === 'success') { await loadConfig(); await refreshData(); }
            else alert('重载配置失败');
        } catch (error) {
            if (error.message !== '需要授权' && error.message !== '授权失败') alert('重载配置失败');
        } finally { setTimeout(() => btn.classList.remove('rotate'), 500); }
    }

    function escapeHtml(text) { if (!text) return ''; return text.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    function setupMobileEvents() {
        const open = () => { sidebar.classList.add('active'); overlay.classList.add('active'); if(window.innerWidth<=768) document.body.classList.add('sidebar-open'); };
        const closeSidebarFn = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); document.body.classList.remove('sidebar-open'); };
        const closeAuthFn = () => { if (document.getElementById('authModal').classList.contains('active')) closeAuthModal(); else closeSidebarFn(); };
        const sidebar = document.getElementById('sidebar'), overlay = document.getElementById('overlay');
        document.getElementById('calendarToggle')?.addEventListener('click', open);
        document.getElementById('mobileCalendarToggle')?.addEventListener('click', open);
        overlay?.addEventListener('click', closeAuthFn);
        window.closeSidebar = closeSidebarFn;
    }
    function closeSidebar() { if(window.innerWidth<=768) document.getElementById('sidebar')?.classList.remove('active'); document.getElementById('overlay')?.classList.remove('active'); document.body.classList.remove('sidebar-open'); }
</script>
</body>
</html>
